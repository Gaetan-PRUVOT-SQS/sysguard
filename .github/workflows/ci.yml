name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  campagne:
    name: Campagne complete (fmt, clippy, tests, couverture, audit, build)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      diff: ${{ steps.fixes.outputs.diff }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2
        with:
          tool: cargo-llvm-cov,cargo-audit

      # Auto-correctifs mecaniques uniquement : formatage puis
      # suggestions clippy applicables automatiquement. Un echec restant
      # (couverture, audit, test) est un incident, pas un correctif
      # automatique.
      - name: Auto-correctifs mecaniques
        id: fixes
        run: |
          cargo fmt
          cargo clippy --fix --all-targets
          if git diff --quiet; then
            echo "diff=0" >> "$GITHUB_OUTPUT"
          else
            echo "diff=1" >> "$GITHUB_OUTPUT"
            git diff > correctifs.patch
          fi

      # Relance : la campagne complete sur l'arbre corrige. Elle doit
      # passer pour qu'un correctif mecanique soit committé.
      - name: Relance de la campagne complete
        run: make campagne

      - name: Piece jointe du correctif
        if: steps.fixes.outputs.diff == '1'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: correctifs-mecaniques
          path: correctifs.patch
          retention-days: 7

      - name: Correctifs non poussables sur une PR
        if: steps.fixes.outputs.diff == '1' && github.event_name == 'pull_request'
        run: |
          git diff --stat
          echo "correctifs mecaniques disponibles : lancer cargo fmt et cargo clippy --fix localement"
          exit 1

  correctif:
    name: Commit du correctif mecanique
    needs: campagne
    if: needs.campagne.outputs.diff == '1' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          token: ${{ secrets.CI_PUSH_TOKEN || github.token }}
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3

      # Meme correctif que celui relance et prouve par le job campagne :
      # fmt et clippy refaits ici sur le meme arbre.
      - name: Refaire les correctifs mecaniques
        run: |
          cargo fmt
          cargo clippy --fix --all-targets
          git diff --quiet && echo "aucun correctif a committer" && exit 0

      - name: Commit et push
        run: |
          git config user.name "Gaetan PRUVOT"
          git config user.email "pruvot.gaetan@gmail.com"
          git add -u
          git commit -m "CI : formatage et corrections clippy automatiques"
          git push origin HEAD:main

  distributions:
    name: ${{ matrix.conteneur }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        conteneur: [debian:13, ubuntu:24.04]
    container: ${{ matrix.conteneur }}
    steps:
      - name: Prerequis (git, curl, certificats, build)
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            git ca-certificates curl build-essential

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # Toolchain via rustup-init téléchargé et exécuté (pas de
      # curl | sh) : les paquets distro restent sous la version exigée
      # par l'édition 2024.
      - name: Toolchain stable
        run: |
          curl -sLO \
            https://static.rust-lang.org/rustup/dist/x86_64-unknown-linux-gnu/rustup-init
          chmod +x rustup-init
          ./rustup-init -y --profile minimal --default-toolchain stable \
            --component rustfmt,clippy
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Tests
        run: make test

      - name: Lint
        run: make lint
