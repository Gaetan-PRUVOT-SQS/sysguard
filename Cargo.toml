[package]
name = "sysguard"
version = "1.4.0"
edition = "2024"
license = "MIT"
description = "Daemon Linux de supervision avec reaction automatique et optimiseur (PSI, zram, CPU)"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "deny"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1

[dependencies]
libc = "0.2"
signal-hook = "0.3"
